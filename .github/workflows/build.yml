name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit test (tidak menggagalkan build)
        run: gradle testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Siapkan keystore (jika secrets ada)
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release (tanda tangan tetap, bisa di-update)
        if: steps.ks.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }} --no-daemon

      - name: Build debug (jika tidak ada secrets)
        if: steps.ks.outputs.signed != 'true'
        run: gradle assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }} --no-daemon

      - name: Kumpulkan APK
        run: |
          mkdir -p out
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk out/disiplin-ai.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk out/disiplin-ai-debug.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: disiplin-ai-apk
          path: out/*

      - name: Rilis ke GitHub Releases
        if: steps.ks.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Disiplin AI 1.${{ github.run_number }}
          files: out/disiplin-ai.apk
