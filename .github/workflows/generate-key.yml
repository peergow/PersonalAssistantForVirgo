name: Buat Keystore
on: workflow_dispatch

jobs:
  buat-kunci:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore dan Base64
        run: |
          keytool -genkeypair -v -keystore disiplin.jks -alias disiplin \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass PASSWORD_KAMU -keypass PASSWORD_KAMU \
            -dname "CN=DisiplinAI, OU=Personal, O=Personal, L=Bandung, S=JawaBarat, C=ID"
          base64 -w0 disiplin.jks > disiplin.b64

      - name: Upload Hasil Kunci
        uses: actions/upload-artifact@v4
        with:
          name: kunci-disiplin
          path: |
            disiplin.jks
            disiplin.b64
